<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chúc Mừng Ngày 20-10</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary-color: #d83a56;
      --secondary-color: #ff6b81;
      --bg-gradient: radial-gradient(circle at center, #fff0f3 0%, #ffc2d1 100%);
      --card-shadow: 0 12px 30px rgba(216, 58, 86, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Quicksand', sans-serif;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-gradient);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 50px 20px 45px;
      position: relative;
    }

    /* Hiệu ứng hạt lấp lánh (Particles) */
    #particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .particle {
      position: absolute;
      background: #ff758f;
      border-radius: 50%;
      opacity: 0.45;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) scale(0.5) rotate(0deg);
        opacity: 0;
      }
      20% {
        opacity: 0.5;
      }
      80% {
        opacity: 0.5;
      }
      100% {
        transform: translateY(-10vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    /* Phần Tiêu đề (Header) */
    .header {
      text-align: center;
      z-index: 10;
      transition: all 0.5s ease;
    }

    .header h1 {
      color: var(--primary-color);
      font-size: 2.3rem;
      font-weight: 700;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(216, 58, 86, 0.1);
    }

    .header p {
      color: var(--primary-color);
      font-size: 1.05rem;
      font-weight: 600;
      opacity: 0.85;
      min-height: 1.5em;
      transition: opacity 0.35s ease;
    }

    .heart-icon {
      display: inline-block;
      margin-top: 6px;
      color: var(--primary-color);
      font-size: 1.1rem;
      opacity: 0;
      transform: scale(0);
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .heart-icon.show {
      opacity: 1;
      transform: scale(1);
    }

    /* Khu vực trung tâm (Bó hoa & Xấp ảnh) */
    .stage {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 360px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }

    /* Bó hoa */
    .bouquet-wrapper {
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .bouquet-wrapper.hide {
      opacity: 0;
      transform: scale(0.4) translateY(50px);
      pointer-events: none;
    }

    .bouquet-svg {
      width: 290px;
      height: 355px;
      overflow: visible;
      filter: drop-shadow(0 14px 25px rgba(216, 58, 86, 0.22));
      animation: floatBouquet 3.5s ease-in-out infinite;
      transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .bouquet-wrapper:hover .bouquet-svg {
      transform: scale(1.05) translateY(-6px);
      filter: drop-shadow(0 18px 30px rgba(216, 58, 86, 0.32));
    }

    .bouquet-shadow {
      width: 125px;
      height: 16px;
      background: radial-gradient(ellipse at center, rgba(216, 58, 86, 0.28) 0%, rgba(216, 58, 86, 0) 75%);
      border-radius: 50%;
      margin-top: 8px;
      animation: shadowScale 3.5s ease-in-out infinite;
    }

    @keyframes floatBouquet {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(0.6deg); }
    }

    @keyframes shadowScale {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(0.78); opacity: 0.35; }
    }

    /* Animation giấy gói & lá xanh */
    .bouquet-wrap {
      animation: wrapEntrance 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      transform-origin: 160px 350px;
    }

    @keyframes wrapEntrance {
      0% {
        opacity: 0;
        transform: translateY(35px) scale(0.9);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .leaf-elem, .baby-elem {
      animation: leavesEntrance 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      transform-origin: 160px 220px;
      opacity: 0;
    }

    @keyframes leavesEntrance {
      0% {
        opacity: 0;
        transform: scale(0.2) rotate(-15deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Animation nở từng bông hoa hồng (Bloom One By One) */
    .rose-bloom {
      opacity: 0;
      transform: scale(0);
      transform-origin: 0px 0px;
      animation: bloomOneByOne 0.9s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes bloomOneByOne {
      0% {
        opacity: 0;
        transform: scale(0) rotate(-40deg);
      }
      65% {
        opacity: 1;
        transform: scale(1.18) rotate(6deg);
      }
      85% {
        transform: scale(0.96) rotate(-2deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
      }
    }

    /* Hiệu ứng lấp lánh (Sparkles) */
    .sparkle {
      animation: sparkleTwinkle 2.4s ease-in-out infinite alternate;
      transform-origin: 0 0;
    }

    @keyframes sparkleTwinkle {
      0%, 20% { opacity: 0; transform: scale(0.2) rotate(0deg); }
      50% { opacity: 1; transform: scale(1.3) rotate(45deg); filter: drop-shadow(0 0 5px #fff); }
      80%, 100% { opacity: 0; transform: scale(0.3) rotate(90deg); }
    }

    /* Hạt pháo hoa/tim bay khi chạm vào bó hoa */
    .burst-particle {
      position: fixed;
      pointer-events: none;
      z-index: 150;
      font-size: 1.25rem;
      animation: burstFloat 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes burstFloat {
      0% {
        transform: translate(-50%, -50%) scale(0.6) rotate(0deg);
        opacity: 1;
      }
      80% {
        opacity: 0.95;
      }
      100% {
        transform: translate(calc(-50% + var(--vx)), calc(-50% + var(--vy))) scale(1.25) rotate(45deg);
        opacity: 0;
      }
    }

    /* Xấp ảnh Polaroid chuyển động theo tầng (Vertical Infinite Looping Stack) */
    .photo-stack {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .photo-stack.active {
      pointer-events: auto;
    }

    .photo-cards {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 1. Giao diện thẻ ảnh (Polaroid Card) */
    .polaroid {
      position: absolute;
      width: 215px; /* Rộng khoảng 200px - 220px */
      background: #ffffff;
      padding: 10px 10px 24px 10px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(216, 58, 86, 0.15);
      cursor: pointer;
      user-select: none;
      touch-action: manipulation;
      transition: all 0.9s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform, opacity;
    }

    .polaroid.no-transition {
      transition: none !important;
    }

    .polaroid img {
      width: 100%;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      border-radius: 10px;
      display: block;
      pointer-events: none;
    }

    .polaroid .caption {
      text-align: center;
      margin-top: 10px;
      font-size: 0.85rem;
      color: #444;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 4px;
    }

    /* 2. Các nấc chuyển động (States) */
    /* Nấc 0 (Điểm xuất phát - Ẩn ở dưới) */
    .polaroid.state-0 {
      transform: translate(0px, 120px) rotate(8deg) scale(0.8);
      opacity: 0;
      z-index: 4;
      pointer-events: none;
    }

    /* Nấc 1 (Tiền cảnh - Rõ nhất, nằm ở chính giữa hơi thấp) */
    .polaroid.state-1 {
      transform: translate(-5px, 20px) rotate(-5deg) scale(1);
      opacity: 1;
      z-index: 3;
      pointer-events: auto;
    }

    .polaroid.state-1:hover {
      transform: translate(-5px, 15px) rotate(-5deg) scale(1.04);
      box-shadow: 0 16px 35px rgba(216, 58, 86, 0.28);
    }

    /* Nấc 2 (Trung cảnh - Bị đẩy lên trên và lệch sang bên khi ảnh mới bay lên) */
    .polaroid.state-2 {
      transform: translate(20px, -25px) rotate(6deg) scale(0.92);
      opacity: 0.65;
      z-index: 2;
      pointer-events: auto;
    }

    .polaroid.state-2:hover {
      transform: translate(20px, -28px) rotate(6deg) scale(0.96);
      box-shadow: 0 14px 30px rgba(216, 58, 86, 0.22);
    }

    /* Nấc 3 (Hậu cảnh - Đẩy lên cao hơn nữa, lệch sang trái và mờ dần) */
    .polaroid.state-3 {
      transform: translate(-20px, -60px) rotate(-8deg) scale(0.85);
      opacity: 0.35;
      z-index: 1;
      pointer-events: auto;
    }

    .polaroid.state-3:hover {
      transform: translate(-20px, -63px) rotate(-8deg) scale(0.89);
    }

    /* Nấc 4 (Biến mất ở phía trên) */
    .polaroid.state-4 {
      transform: translate(0px, -95px) rotate(0deg) scale(0.75);
      opacity: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* Nút bấm mở thư (CTA) */
    .footer {
      z-index: 10;
      min-height: 55px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .hint-text {
      font-size: 0.8rem;
      color: var(--primary-color);
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .hint-text.show {
      opacity: 0.7;
    }

    .btn-message {
      background: rgba(255, 255, 255, 0.9);
      color: var(--primary-color);
      border: 2px solid #ffccd5;
      padding: 11px 26px;
      border-radius: 50px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(216, 58, 86, 0.15);
      opacity: 0;
      transform: translateY(25px);
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .footer-actions {
      display: flex;
      gap: 12px;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-message.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-message:hover {
      background: var(--secondary-color);
      color: #ffffff;
      border-color: var(--secondary-color);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 129, 0.35);
    }

    .btn-replay {
      background: rgba(255, 255, 255, 0.9);
      color: var(--primary-color);
      border: 2px solid #ffccd5;
      padding: 11px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 6px 20px rgba(216, 58, 86, 0.12);
      opacity: 0;
      transform: translateY(25px);
      pointer-events: none;
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .btn-replay.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .btn-replay:hover {
      background: #ffffff;
      border-color: var(--secondary-color);
      color: var(--secondary-color);
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(216, 58, 86, 0.22);
    }

    .modal-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn-replay-modal {
      background: #fff0f3;
      color: var(--primary-color);
      border: 1.5px solid #ffccd5;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-replay-modal:hover {
      background: #ffe3e8;
      transform: translateY(-2px);
    }

    /* 3. Lightbox Phóng to ảnh (Full-screen Zoom) */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      padding: 20px;
    }

    .lightbox.open {
      opacity: 1;
      pointer-events: auto;
    }

    .lightbox-card {
      background: #ffffff;
      padding: 16px 16px 22px 16px;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      max-width: 90vw;
      width: auto;
      height: 75vh;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transform: scale(0.85);
      transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
      position: relative;
    }

    .lightbox.open .lightbox-card {
      transform: scale(1);
    }

    .lightbox-card img {
      width: auto;
      max-width: 100%;
      height: calc(100% - 46px);
      max-height: calc(75vh - 75px);
      border-radius: 12px;
      object-fit: contain;
      display: block;
      background: #fafafa;
    }

    .lightbox-caption {
      margin-top: 10px;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary-color);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
      padding: 0 8px;
    }

    .lightbox-close-btn {
      position: absolute;
      top: -12px;
      right: -12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #ffffff;
      color: var(--primary-color);
      border: 2px solid #ffccd5;
      font-size: 1.15rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      transition: all 0.25s ease;
      z-index: 10;
    }

    .lightbox-close-btn:hover {
      background: var(--primary-color);
      color: #ffffff;
      transform: scale(1.1);
    }

    /* Modal Tâm Thư */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease;
      padding: 20px;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #ffffff;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 32px 28px 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      transform: translateY(30px) scale(0.95);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: center;
    }

    .modal-overlay.open .modal-card {
      transform: translateY(0) scale(1);
    }

    .modal-title {
      color: var(--primary-color);
      font-size: 1.55rem;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .modal-body {
      text-align: left;
      color: #444;
      font-size: 0.98rem;
      line-height: 1.65;
      margin-bottom: 24px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .modal-body p {
      margin-bottom: 12px;
    }

    .btn-close {
      background: var(--secondary-color);
      color: #ffffff;
      border: none;
      padding: 10px 32px;
      border-radius: 50px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 107, 129, 0.35);
      transition: background 0.25s ease, transform 0.2s ease;
    }

    .btn-close:hover {
      background: var(--primary-color);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Hạt lấp lánh bay nền -->
  <div id="particles"></div>

  <!-- Phần Tiêu Đề -->
  <header class="header">
    <h1 id="main-title">Bó hoa tặng Em iu của Khải nè</h1>
    <p id="sub-title">Chạm nhẹ vào hoa nha!</p>
    <div id="heart-icon" class="heart-icon">❤️</div>
  </header>

  <!-- Khu vực Bó Hoa & Ảnh Polaroid -->
  <!-- Khu vực Bó Hoa & Ảnh Polaroid -->
  <main class="stage">
    <!-- Bó hoa hồng nghệ thuật -->
    <div id="bouquet" class="bouquet-wrapper" title="Chạm vào bó hoa">
      <svg id="bouquet-svg" class="bouquet-svg" viewBox="0 0 320 390" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- 1. Red Velvet Gradients -->
          <radialGradient id="redCoreGrad" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#38000a" />
            <stop offset="40%" stop-color="#6a0014" />
            <stop offset="75%" stop-color="#990024" />
            <stop offset="100%" stop-color="#bd0034" />
          </radialGradient>
          <linearGradient id="redPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#720017" />
            <stop offset="45%" stop-color="#a4161a" />
            <stop offset="85%" stop-color="#e5383b" />
            <stop offset="100%" stop-color="#ff758f" />
          </linearGradient>
          <linearGradient id="redOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4d6d" />
            <stop offset="30%" stop-color="#ba181b" />
            <stop offset="75%" stop-color="#660708" />
            <stop offset="100%" stop-color="#38000a" />
          </linearGradient>

          <!-- 2. Scarlet / Radiant Red Gradients -->
          <radialGradient id="scarletCoreGrad" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#4d000f" />
            <stop offset="45%" stop-color="#800f2f" />
            <stop offset="80%" stop-color="#c9184a" />
            <stop offset="100%" stop-color="#ff4d6d" />
          </radialGradient>
          <linearGradient id="scarletPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#8a0b25" />
            <stop offset="40%" stop-color="#d90429" />
            <stop offset="80%" stop-color="#ef233c" />
            <stop offset="100%" stop-color="#ff8fa3" />
          </linearGradient>

          <!-- 3. Soft Romantic Pink Gradients -->
          <radialGradient id="pinkCoreGrad" cx="50%" cy="45%" r="55%">
            <stop offset="0%" stop-color="#590d22" />
            <stop offset="45%" stop-color="#800f2f" />
            <stop offset="80%" stop-color="#c9184a" />
            <stop offset="100%" stop-color="#ff758f" />
          </radialGradient>
          <linearGradient id="pinkPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#a4133c" />
            <stop offset="40%" stop-color="#ff4d6d" />
            <stop offset="80%" stop-color="#ff8fa3" />
            <stop offset="100%" stop-color="#ffe5ec" />
          </linearGradient>
          <linearGradient id="pinkOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffccd5" />
            <stop offset="40%" stop-color="#ff758f" />
            <stop offset="80%" stop-color="#a4133c" />
            <stop offset="100%" stop-color="#590d22" />
          </linearGradient>

          <!-- Foliage Gradients -->
          <linearGradient id="leafGrad1" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#143621" />
            <stop offset="45%" stop-color="#2d6a4f" />
            <stop offset="85%" stop-color="#52b788" />
            <stop offset="100%" stop-color="#74c69d" />
          </linearGradient>

          <!-- Wrapping Gradients -->
          <linearGradient id="wrapOuterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffccd5" />
            <stop offset="35%" stop-color="#ffb3c1" />
            <stop offset="70%" stop-color="#ff8fa3" />
            <stop offset="100%" stop-color="#fb6f92" />
          </linearGradient>

          <linearGradient id="wrapInnerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="65%" stop-color="#fff0f3" />
            <stop offset="100%" stop-color="#ffd1dc" />
          </linearGradient>

          <linearGradient id="wrapBackFold" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ffe5ec" />
            <stop offset="100%" stop-color="#ffb3c1" />

  <script>
    /* =========================================================================
       KHU VỰC CẤU HÌNH DỮ LIỆU (BẠN CHỈ CẦN SỬA NỘI DUNG & THAY ẢNH Ở ĐÂY)
       ========================================================================= */
    const CONFIG = {
      // 1. Tiêu đề chính và phụ
      mainTitle: "Bó hoa tặng Em iu của Khải nè",
      initialSubTitle: "Chạm nhẹ vào đây nha!",
      afterClickSubTitle: "Chúc mừng ngày 20-10, chúc bé luôn xinh đẹp và rạng rỡ!",

      // 2. Đường dẫn ảnh bó hoa (Có thể thay bằng file ảnh .png nền trong suốt của bạn, VD: "./images/hoa.png")
      bouquetImage: "https://cdn-icons-png.flaticon.com/512/4149/4149881.png",

      // 3. Danh sách ảnh kỷ niệm (Thay link bên dưới bằng đường dẫn ảnh thật của bạn, VD: "./img/anh1.jpg")
      photos: [
        {
          url: "./images/39fc48eb-e150-45e9-9dd0-85d9e02dec94.jpeg",
          caption: "Lúc chăm chỉ cũng thật đáng yêu ✨"
        },
        {
          url: "./images/a4519c39-e594-4bc2-b79d-db8e324859b4.jpeg",
          caption: "Nụ cười làm tan chảy tim anh 💖"
        },
        {
          url: "./images/b8bd083d-5b52-4884-98d7-e9d589ca9944.jpeg",
          caption: "Nàng thơ dịu dàng của anh 🌸"
        },
        {
          url: "./images/c00f96bb-936a-477d-ba4e-42353475dcb6.jpeg",
          caption: "Happy Women's Day 🌷"
        }
      ],

      // 4. Nội dung bức thư & Nút bấm
      buttonText: "Bé có tin nhắn nò",
      letterTitle: "Gửi Em IU 💕",
      letterParagraphs: [
        "20/10! Anh hổng biết làm gì khác ngoài tặng em bó hoa này thay cho hoa thiệt",
        "Cảm ơn em vì đã đến và ở bên anh",
        "Mong rằng mỗi ngày trôi qua, em đều sẽ luôn hạnh phúc ở mãi bên anh",
        "Chúc em có một ngày 20/10 thật nhiều niềm vui và thoải mái! 💖",
        "Yêu em nhiềuu"
      ],
      closeButtonText: "Đóng thư"
    };

    /* =========================================================================
       LOGIC XỬ LÝ HIỆU ỨNG (KHÔNG CẦN CHỈNH SỬA PHẦN NÀY)
       ========================================================================= */
    const mainTitleEl = document.getElementById('main-title');
    const subTitleEl = document.getElementById('sub-title');
    const heartIconEl = document.getElementById('heart-icon');
    const bouquetEl = document.getElementById('bouquet');
    const photoStackEl = document.getElementById('photo-stack');
    const hintTextEl = document.getElementById('hint-text');
    const btnMessageEl = document.getElementById('btn-message');
    const btnMessageTextEl = document.getElementById('btn-message-text');
    const btnReplayEl = document.getElementById('btn-replay');
    const btnReplayModalEl = document.getElementById('btn-replay-modal');

    const lightboxEl = document.getElementById('lightbox');
    const lightboxImgEl = document.getElementById('lightbox-img');
    const lightboxCaptionEl = document.getElementById('lightbox-caption');

    const modalOverlayEl = document.getElementById('modal-overlay');
    const modalTitleEl = document.getElementById('modal-title');
    const modalBodyEl = document.getElementById('modal-body');
    const btnCloseEl = document.getElementById('btn-close');

    let loopTimer = null;
    let currentStep = 0;
    let isStackPaused = false;
    let isLightboxOpen = false;
    let isPhotoHovered = false;
    let pendingResetTimeouts = [];

    // Khởi tạo nội dung từ CONFIG
    function initTemplate() {
      mainTitleEl.textContent = CONFIG.mainTitle;
      subTitleEl.textContent = CONFIG.initialSubTitle;
      btnMessageTextEl.textContent = CONFIG.buttonText;
      modalTitleEl.textContent = CONFIG.letterTitle;
      btnCloseEl.textContent = CONFIG.closeButtonText;

      // Render đoạn văn trong thư
      modalBodyEl.innerHTML = CONFIG.letterParagraphs
        .map(text => `<p>${text}</p>`)
        .join('');

      // Khởi tạo danh sách thẻ ảnh Polaroid
      renderPhotoStack();

      createParticles();
    }

    // Render danh sách ảnh Polaroid
    function renderPhotoStack() {
      let photosList = [...CONFIG.photos];
      if (photosList.length < 4) {
        while (photosList.length < 4) {
          photosList = photosList.concat(CONFIG.photos);
        }
      }

      photoStackEl.innerHTML = '<div id="photo-cards" class="photo-cards"></div>';
      const photoCardsEl = document.getElementById('photo-cards');

      photosList.forEach((photo, index) => {
        const card = document.createElement('div');
        // Ban đầu tất cả thẻ ở Nấc 0 (Điểm xuất phát - Ẩn ở dưới)
        card.className = 'polaroid state-0';
        card.dataset.index = index;

        card.innerHTML = `
          <img src="${photo.url}" alt="${photo.caption || 'Ảnh kỷ niệm'}" />
          <div class="caption">${photo.caption || ''}</div>
        `;

        // Click để phóng to Full-screen Zoom
        card.addEventListener('click', (e) => {
          e.stopPropagation();
          openLightbox(photo.url, photo.caption);
        });

        // Hover tạm dừng để tương tác dễ dàng
        card.addEventListener('mouseenter', () => {
          isPhotoHovered = true;
        });
        card.addEventListener('mouseleave', () => {
          isPhotoHovered = false;
        });

        photoCardsEl.appendChild(card);
      });
    }

    // Thiết lập trạng thái nấc cho thẻ
    function setCardState(card, stateNum) {
      card.classList.remove('state-0', 'state-1', 'state-2', 'state-3', 'state-4');
      card.classList.add(`state-${stateNum}`);
    }

    // Silent reset một thẻ về state-0 không có transition
    function silentResetCardToState0(card) {
      card.classList.add('no-transition');
      card.classList.remove('state-0', 'state-1', 'state-2', 'state-3', 'state-4');
      card.classList.add('state-0');
      void card.offsetHeight; // Kích hoạt reflow
      card.classList.remove('no-transition');
    }

    // Tiến trình dịch chuyển các ảnh lên 1 nấc (Vertical Infinite Looping Stack)
    function advanceStack() {
      const cards = document.querySelectorAll('.polaroid');
      const N = cards.length;
      if (!N) return;

      const k = currentStep;

      // 1. Thẻ tiến vào Nấc 1 (Tiền cảnh - Rõ nhất, nằm ở chính giữa hơi thấp)
      const idx1 = k % N;
      setCardState(cards[idx1], 1);

      // 2. Thẻ chuyển sang Nấc 2 (Trung cảnh - Bị đẩy lên trên và lệch sang bên)
      if (k >= 1) {
        const idx2 = ((k - 1) % N + N) % N;
        setCardState(cards[idx2], 2);
      }

      // 3. Thẻ chuyển sang Nấc 3 (Hậu cảnh - Đẩy lên cao hơn nữa, lệch sang trái và mờ dần)
      if (k >= 2) {
        const idx3 = ((k - 2) % N + N) % N;
        setCardState(cards[idx3], 3);
      }

      // 4. Thẻ chuyển sang Nấc 4 (Biến mất ở phía trên)
      if (k >= 3) {
        const idx4 = ((k - 3) % N + N) % N;
        const c4 = cards[idx4];
        setCardState(c4, 4);

        // Sau khi hoàn tất transition (0.9s = 900ms), âm thầm đưa về Nấc 0 không có transition
        const tId = setTimeout(() => {
          if (c4.classList.contains('state-4')) {
            silentResetCardToState0(c4);
          }
        }, 920);
        pendingResetTimeouts.push(tId);
      }

      currentStep++;
    }

    // Vòng lặp cập nhật nấc mỗi 1300ms
    function startStackLoop() {
      stopStackLoop();
      isStackPaused = false;
      loopTimer = setInterval(() => {
        if (!isStackPaused && !isLightboxOpen && !isPhotoHovered) {
          advanceStack();
        }
      }, 1300);
    }

    function pauseStackLoop() {
      isStackPaused = true;
    }

    function resumeStackLoop() {
      isStackPaused = false;
    }

    function stopStackLoop() {
      if (loopTimer) {
        clearInterval(loopTimer);
        loopTimer = null;
      }
      isStackPaused = false;
      pendingResetTimeouts.forEach(t => clearTimeout(t));
      pendingResetTimeouts = [];
    }

    // Tạo hiệu ứng tim & hoa bay lãng mạn khi chạm vào bó hoa
    function createBurstEffect(x, y) {
      const symbols = ['🌸', '🌹', '💖', '✨', '💕', '🌷'];
      const count = 18;
      for (let i = 0; i < count; i++) {
        const span = document.createElement('span');
        span.className = 'burst-particle';
        span.textContent = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = `${x}px`;
        span.style.top = `${y}px`;
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const velocity = Math.random() * 85 + 65;
        const vx = Math.cos(angle) * velocity;
        const vy = Math.sin(angle) * velocity;
        span.style.setProperty('--vx', `${vx}px`);
        span.style.setProperty('--vy', `${vy}px`);
        document.body.appendChild(span);
        setTimeout(() => span.remove(), 1200);
      }
    }

    // Sự kiện click vào bó hoa
    bouquetEl.addEventListener('click', (e) => {
      // Tọa độ bung nở tim/hoa
      const rect = bouquetEl.getBoundingClientRect();
      const clickX = e.clientX || (rect.left + rect.width / 2);
      const clickY = e.clientY || (rect.top + rect.height / 2);
      createBurstEffect(clickX, clickY);

      // Ẩn bó hoa
      bouquetEl.classList.add('hide');

      // Đổi phụ đề
      subTitleEl.style.opacity = 0;
      setTimeout(() => {
        subTitleEl.textContent = CONFIG.afterClickSubTitle;
        subTitleEl.style.opacity = 1;
        heartIconEl.classList.add('show');
      }, 300);

      // Kích hoạt xấp ảnh và bắt đầu hiển thị ảnh đầu tiên bay lên
      photoStackEl.classList.add('active');
      currentStep = 0;
      advanceStack(); // Bước 0: Thẻ đầu tiên bay từ Nấc 0 lên Nấc 1
      startStackLoop(); // Chu kỳ 1300ms nối tiếp

      // Hiện nút mở thư & ngắm lại hoa
      setTimeout(() => {
        hintTextEl.classList.add('show');
        btnMessageEl.classList.add('show');
        if (btnReplayEl) btnReplayEl.classList.add('show');
      }, 600);
    });

    // Hàm ngắm lại bó hoa hồng (Replay animation nở từng bông)
    function replayBouquet() {
      // Dừng vòng lặp ảnh
      stopStackLoop();

      // Reset tất cả các thẻ ảnh về Nấc 0 không có transition
      const cards = document.querySelectorAll('.polaroid');
      cards.forEach(card => {
        silentResetCardToState0(card);
      });
      currentStep = 0;
      photoStackEl.classList.remove('active');

      // Ẩn nút & hint
      hintTextEl.classList.remove('show');
      btnMessageEl.classList.remove('show');
      if (btnReplayEl) btnReplayEl.classList.remove('show');
      heartIconEl.classList.remove('show');

      // Đổi phụ đề về ban đầu
      subTitleEl.style.opacity = 0;
      setTimeout(() => {
        subTitleEl.textContent = CONFIG.initialSubTitle;
        subTitleEl.style.opacity = 1;
      }, 300);

      // Đóng modal & lightbox nếu đang mở
      modalOverlayEl.classList.remove('open');
      closeLightbox();

      // Hiện lại bó hoa & kích hoạt lại animation hoa nở
      bouquetEl.classList.remove('hide');
      const svg = document.getElementById('bouquet-svg');
      if (svg) {
        const clone = svg.cloneNode(true);
        svg.parentNode.replaceChild(clone, svg);
      }
    }

    if (btnReplayEl) {
      btnReplayEl.addEventListener('click', replayBouquet);
    }
    if (btnReplayModalEl) {
      btnReplayModalEl.addEventListener('click', replayBouquet);
    }

    // 3. Tương tác Click xem ảnh (Full-screen Zoom)
    function openLightbox(url, caption) {
      isLightboxOpen = true;
      lightboxImgEl.src = url;
      lightboxCaptionEl.textContent = caption || '';
      lightboxEl.classList.add('open');
      pauseStackLoop(); // Tạm dừng vòng lặp bay khi đang mở Lightbox
    }

    function closeLightbox() {
      if (!isLightboxOpen) return;
      lightboxEl.classList.remove('open');
      isLightboxOpen = false;
      resumeStackLoop(); // Cho vòng lặp chạy tiếp khi đóng Lightbox
    }

    lightboxEl.addEventListener('click', (e) => {
      // Đóng khi click ra vùng nền hoặc nút đóng
      if (e.target === lightboxEl || e.target.id === 'lightbox-close') {
        closeLightbox();
      }
    });

    // Mở & Đóng Modal Tâm thư
    btnMessageEl.addEventListener('click', () => {
      modalOverlayEl.classList.add('open');
    });

    btnCloseEl.addEventListener('click', () => {
      modalOverlayEl.classList.remove('open');
    });

    modalOverlayEl.addEventListener('click', (e) => {
      if (e.target === modalOverlayEl) {
        modalOverlayEl.classList.remove('open');
      }
    });

    // Hỗ trợ phím ESC đóng lightbox hoặc modal
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (isLightboxOpen) closeLightbox();
        else if (modalOverlayEl.classList.contains('open')) {
          modalOverlayEl.classList.remove('open');
        }
      }
    });

    // Tạo hạt lấp lánh nền
    function createParticles() {
      const container = document.getElementById('particles');
      const count = 28;
      for (let i = 0; i < count; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 6 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        p.style.left = `${Math.random() * 100}vw`;
        p.style.animationDuration = `${Math.random() * 7 + 6}s`;
        p.style.animationDelay = `${Math.random() * 5}s`;
        container.appendChild(p);
      }
    }

    initTemplate();
  </script>
</body>
</html>
